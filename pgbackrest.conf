[global]
# The bucket comes from PGBACKREST_REPO1_GCS_BUCKET. Local runs can use
# PGBACKREST_REPO1_TYPE=posix and PGBACKREST_REPO1_PATH instead.
repo1-type=gcs
# Authenticate as the Cloud Run service account through the metadata server.
repo1-gcs-key-type=auto
repo1-path=/pgbackrest
repo1-retention-full=2
# Pack the many small data files into a few objects instead of uploading each one.
repo1-bundle=y
compress-type=lz4
# Back up right away instead of waiting for the next checkpoint.
start-fast=y
log-level-console=info
log-level-file=off

[app]
pg1-path=/data/pgdata
pg1-socket-path=/tmp
