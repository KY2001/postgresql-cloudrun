# Only the server in this container connects, over a Unix socket.
listen_addresses = ''
unix_socket_directories = '/tmp'
max_connections = 20
timezone = 'UTC'

# The ephemeral disk is small.
max_wal_size = 256MB

# pgBackRest ships every finished WAL segment to GCS and fetches them back on restore. initdb
# uses 1 MB segments, so a segment finishes often under writes.
archive_mode = on
archive_command = 'pgbackrest --stanza=app archive-push %p'
# Only fires while a request gives the instance CPU; the scheduled /sync covers idle periods.
archive_timeout = 60
restore_command = 'pgbackrest --stanza=app archive-get %f "%p"'
# New segments are zero-filled instead of recycled, so a mostly empty segment compresses to almost
# nothing when archive_timeout or /sync switches to the next one.
wal_recycle = off
